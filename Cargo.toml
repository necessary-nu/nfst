[workspace]
resolver = "3"
members = [
    "crates/nfst-syntax",
    "crates/nfst-xre",
    "crates/nfst-lexc",
    "crates/nfst-pmatch",
    "crates/nfst-twolc",
    "crates/nfst-xfst",
]

# Versions are deliberately NOT inherited. Each grammar crate tracks a
# different upstream language and they are fixed and released independently,
# so a lockstep version would either bump crates that did not change or hold
# back one that did. Each crate sets its own `version` in its manifest; the
# pins below have to be moved by hand when nfst-syntax or nfst-xre is bumped.
[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/necessary-nu/nfst"

[workspace.dependencies]
nfst-syntax = { path = "crates/nfst-syntax", version = "0.3.0" }
nfst-xre = { path = "crates/nfst-xre", version = "0.4.0" }
ariadne = "0.5"
chumsky = "0.10"
logos = "0.15"
smol_str = "0.3"
